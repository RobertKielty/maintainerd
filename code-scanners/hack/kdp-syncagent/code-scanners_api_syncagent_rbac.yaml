---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcp-api-syncagent:default:resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcp-api-syncagent:default:resources
subjects:
  - kind: ServiceAccount
    name: kcp-api-syncagent
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcp-api-syncagent:default:resources
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        agent.kdp.k8c.io/namespace: "default"
        agent.kdp.k8c.io/name: "kcp-api-syncagent"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    agent.kdp.k8c.io/namespace: "default"
    agent.kdp.k8c.io/name: "kcp-api-syncagent"
  name: kcp-api-syncagent:default:resources:greeter.wojciech12.github.com
rules:
  - apiGroups:
      - greeter.wojciech12.github.com
    resources:
      - greeters
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    agent.kdp.k8c.io/namespace: "default"
    agent.kdp.k8c.io/name: "kcp-api-syncagent"
  name: kcp-api-syncagent:default:resources:configmap
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - "*"
