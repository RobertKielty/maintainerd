openapi: 3.1.0
info:
  title: FOSSA API
  version: 4.32.3
servers:
  - url: https://app.fossa.com/api
paths:
  /teams:
    get:
      operationId: listTeams
      responses:
        "200":
          description: Teams list
          content:
            application/json:
              examples:
                default_teams:
                  value:
                    - id: 101
                      organizationId: 162
                      name: Project Fossa Full
                      defaultRoleId: 4
                      autoAddUsers: false
                      uniqueIdentifier: project-fossa-full
                    - id: 102
                      organizationId: 162
                      name: Project Fossa Partial
                      defaultRoleId: 4
                      autoAddUsers: false
                      uniqueIdentifier: project-fossa-partial
                    - id: 103
                      organizationId: 162
                      name: Project Fossa Invites
                      defaultRoleId: 4
                      autoAddUsers: false
                      uniqueIdentifier: project-fossa-invites
                    - id: 104
                      organizationId: 162
                      name: Project Fossa Missing Email
                      defaultRoleId: 4
                      autoAddUsers: false
                      uniqueIdentifier: project-fossa-missing-email
    post:
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            examples:
              create_no_license:
                value:
                  name: Project No License
      responses:
        "200":
          description: Team created
          content:
            application/json:
              examples:
                create_no_license:
                  value:
                    id: 105
                    organizationId: 162
                    name: Project No License
                    defaultRoleId: 4
                    autoAddUsers: false
                    uniqueIdentifier: project-no-license
  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          examples:
            fossa_full:
              value: 101
            fossa_partial:
              value: 102
            fossa_invites:
              value: 103
            fossa_missing:
              value: 104
            no_license:
              value: 105
      responses:
        "200":
          description: Team members list
          content:
            application/json:
              examples:
                fossa_full:
                  value:
                    results:
                      - userId: 1
                        roleId: 4
                        username: antonio-example
                        email: antonio.example@test.dev
                      - userId: 2
                        roleId: 4
                        username: renee-sample
                        email: renee.sample@example.dev
                    pageSize: 2
                    page: 0
                    totalCount: 2
                fossa_partial:
                  value:
                    results:
                      - userId: 3
                        roleId: 4
                        username: alex-example
                        email: alex@example.dev
                    pageSize: 1
                    page: 0
                    totalCount: 1
                fossa_invites:
                  value:
                    results:
                      - userId: 4
                        roleId: 4
                        username: priya-demo
                        email: priya.demo@test.dev
                    pageSize: 1
                    page: 0
                    totalCount: 1
                fossa_missing:
                  value:
                    results: []
                    pageSize: 0
                    page: 0
                    totalCount: 0
                no_license:
                  value:
                    results: []
                    pageSize: 0
                    page: 0
                    totalCount: 0
  /users:
    get:
      operationId: listUsers
      parameters:
        - name: count
          in: query
          required: false
          schema:
            type: integer
          examples:
            default_users:
              value: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
          examples:
            default_users:
              value: 0
      responses:
        "200":
          description: Users list
          content:
            application/json:
              examples:
                default_users:
                  value:
                    - id: 1
                      username: antonio.example@test.dev
                      email: antonio.example@test.dev
                      github:
                        name: antonio-example
                        email: antonio@example.dev
                      bitbucketCloud:
                        name: null
                        email: null
                      teamUsers:
                        - roleId: 4
                          team:
                            id: 101
                            name: Project Fossa Full
                    - id: 2
                      username: renee-sample
                      email: renee@example.dev
                      github:
                        name: renee-sample
                        email: renee@example.dev
                      bitbucketCloud:
                        name: null
                        email: null
                      teamUsers:
                        - roleId: 4
                          team:
                            id: 101
                            name: Project Fossa Full
                    - id: 3
                      username: alex@example.dev
                      email: alex@example.dev
                      github:
                        name: alex-example
                        email: alex@example.dev
                      bitbucketCloud:
                        name: null
                        email: null
                      teamUsers:
                        - roleId: 4
                          team:
                            id: 999
                            name: Another Team
                    - id: 4
                      username: priya.demo@test.dev
                      email: priya.demo@test.dev
                      github:
                        name: priya-demo
                        email: priya@example.dev
                      bitbucketCloud:
                        name: null
                        email: null
                      teamUsers:
                        - roleId: 4
                          team:
                            id: 103
                            name: Project Fossa Invites
                    - id: 5
                      username: jun.example@test.dev
                      email: jun.example@test.dev
                      github:
                        name: jun-example
                        email: jun@example.dev
                      bitbucketCloud:
                        name: null
                        email: null
                      teamUsers:
                        - roleId: 4
                          team:
                            id: 103
                            name: Project Fossa Invites
                    - id: 94780
                      username: bob@affiliated-company.tld
                      email: bob@affiliated-company.tld
                      github:
                        name: bob
                        email: bob@users.noreply.github.com
                      bitbucketCloud:
                        name: null
                        email: null
                      teamUsers:
                        - roleId: 4
                          team:
                            id: 999
                            name: Another Team
  /roles:
    get:
      operationId: listRoles
      responses:
        "200":
          description: Roles list
          content:
            application/json:
              examples:
                default_roles:
                  value:
                    - id: 1
                      scope: organization
                      name: Admin
                    - id: 2
                      scope: organization
                      name: Editor
                    - id: 3
                      scope: organization
                      name: Viewer
                    - id: 4
                      scope: team
                      name: Team Admin
                    - id: 5
                      scope: team
                      name: Team Editor
                    - id: 6
                      scope: team
                      name: Team Viewer
  /user-invitations:
    get:
      operationId: listUserInvitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              examples:
                no_pending_invites:
                  value: []
  /organizations/{organizationId}/invite:
    post:
      operationId: inviteUserToOrganization
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
          examples:
            send_invite:
              value: "162"
      requestBody:
        required: true
        content:
          application/json:
            examples:
              send_invite:
                value:
                  email: invitee@example.test
      responses:
        "200":
          description: Invitation created
          content:
            application/json:
              examples:
                send_invite:
                  value: {}
  /teams/{id}/users:
    put:
      operationId: updateTeamUsers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          examples:
            add_team_admin_full:
              value: 101
            add_team_admin_partial:
              value: 102
            add_team_admin_invites:
              value: 103
            add_team_admin_missing:
              value: 104
            add_team_admin_no_license:
              value: 105
            add_team_admin_legacy:
              value: 102209
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - add
                    - remove
                    - replace
                users:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                      roleId:
                        type: integer
            examples:
              add_team_admin_partial:
                value:
                  action: add
                  users:
                    - id: 94780
                      roleId: 4
              add_team_admin_no_license:
                value:
                  action: add
                  users:
                    - id: 2
                      roleId: 4
      responses:
        "200":
          description: Team users updated
          content:
            application/json:
              examples:
                add_team_admin_partial:
                  value:
                    id: 102
                    users:
                      - userId: 1
                        roleId: 4
                add_team_admin_full:
                  value:
                    id: 101
                    users:
                      - userId: 1
                        roleId: 4
                      - userId: 2
                        roleId: 4
                add_team_admin_invites:
                  value:
                    id: 103
                    users:
                      - userId: 4
                        roleId: 4
                      - userId: 5
                        roleId: 4
                add_team_admin_missing:
                  value:
                    id: 104
                    users:
                      - userId: 94780
                        roleId: 4
                add_team_admin_no_license:
                  value:
                    id: 105
                    users:
                      - userId: 2
                        roleId: 4
                add_team_admin_legacy:
                  value:
                    id: 102209
                    users:
                      - userId: 92921
                        roleId: 4
                      - userId: 92922
                        roleId: 4
                      - userId: 94780
                        roleId: 4
